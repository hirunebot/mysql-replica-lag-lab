[package]
name = "mysql-replica-lag-lab"
version = "0.1.0"
edition = "2024"
description = "A reproducible MySQL replica lag demonstration written in Rust"
license = "MIT"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }

